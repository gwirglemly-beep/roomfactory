<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room-Factory — технические работы</title>
<meta name="robots" content="noindex, nofollow">
<style>
@font-face { font-family: 'Unbounded'; font-style: normal; font-weight: 300 900; font-display: swap; src: url("fonts/unbounded-cyrillic.woff2") format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Unbounded'; font-style: normal; font-weight: 300 900; font-display: swap; src: url("fonts/unbounded-latin.woff2") format('woff2'); unicode-range: U+0000-00FF; }
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 300 500; font-display: swap; src: url("fonts/inter-cyrillic.woff2") format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 300 500; font-display: swap; src: url("fonts/inter-latin.woff2") format('woff2'); unicode-range: U+0000-00FF; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f2ed; color: #1a1208; font-family: 'Inter', sans-serif; padding: 24px; text-align: center; }
.box { max-width: 480px; }
.logo { font-family: 'Unbounded', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 40px; }
.logo span { color: #b48c5a; }
.badge { display: inline-block; font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #b48c5a; background: rgba(180,140,90,0.12); padding: 8px 16px; border-radius: 20px; margin-bottom: 24px; }
h1 { font-family: 'Unbounded', sans-serif; font-size: clamp(24px, 5vw, 32px); font-weight: 800; line-height: 1.25; margin: 0 0 16px; letter-spacing: -0.5px; }
p { font-size: 16px; line-height: 1.6; color: #5a4d3d; margin: 0 0 8px; }
.contact { margin-top: 32px; font-size: 14px; color: #8a7a66; }
.contact a { color: #b48c5a; text-decoration: none; }
.contact a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">Room<span>-</span>Factory</div>
  <div class="badge">Технические работы</div>
  <h1>Мы скоро вернёмся</h1>
  <p>Сайт временно недоступен — проводим технические работы.</p>
  <p>Обычно это занимает не больше пары дней.</p>
  <div class="contact">По вопросам: <a href="mailto:center@room-factory.ru">center@room-factory.ru</a></div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — Room Factory</title>
<meta name="robots" content="noindex">
<style>
@font-face { font-family: 'Unbounded'; font-style: normal; font-weight: 300 900; font-display: swap; src: url("fonts/unbounded-cyrillic.woff2") format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Unbounded'; font-style: normal; font-weight: 300 900; font-display: swap; src: url("fonts/unbounded-latin.woff2") format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 300 500; font-display: swap; src: url("fonts/inter-cyrillic.woff2") format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 300 500; font-display: swap; src: url("fonts/inter-latin.woff2") format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #f5f2ed; color: #1a1208; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
.wrap { max-width: 480px; }
.mark { width: 72px; height: 72px; border-radius: 18px; background: #1a1208; color: #f5f2ed; font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 34px; display: flex; align-items: center; justify-content: center; margin: 0 auto 28px; }
.code { font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: clamp(48px, 12vw, 80px); letter-spacing: -2px; color: #b48c5a; line-height: 1; margin: 0 0 12px; }
h1 { font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 700; margin: 0 0 12px; color: #1a1208; }
p { font-size: 14px; line-height: 1.6; color: #8a7a66; margin: 0 0 32px; }
a.btn { display: inline-block; background: #b48c5a; color: #fff; text-decoration: none; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 16px 32px; border-radius: 2px; }
a.btn:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">R</div>
  <p class="code">404</p>
  <h1>Такой комнаты у нас нет</h1>
  <p>Страница, которую вы искали, не найдена — возможно, ссылка устарела или в адресе опечатка.</p>
  <a class="btn" href="/">На главную</a>
</div>
</body>
</html>
